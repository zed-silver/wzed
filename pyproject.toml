[project]
name = "wzed"
version = "0.0.1"
description = "100% local voice dictation for Windows (a private alternative to Wispr Flow)"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.1",
    "onnx-asr[gpu,hub]>=0.8",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9",
    "jiwer>=3.0",
    "pynput>=1.7",
    "pywin32>=306",
    "pydantic-settings>=2.2",
    "onnxruntime-gpu>=1.20,<1.23",
    "nvidia-cuda-runtime-cu12>=12.9.79",
    "nvidia-cufft-cu12>=11.4.1.4",
    "nvidia-curand-cu12>=10.3.10.19",
    "PySide6>=6.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

# No console-scripts/gui-scripts on purpose: the .exe files pip generates are
# UNSIGNED and Norton blocks them on reputation. We run via the venv's pythonw.exe
# (signed by the PSF) with `-m wzed` (see src/wzed/__main__.py and scripts/install.ps1).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wzed"]

# dev group: `uv sync` installs it by default, so pytest never disappears from the venv
# (a `uv sync --extra api` without `--extra dev` used to remove pytest and the tests
# then ran in an isolated environment, without the project's deps).
[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.0",
]
