[project]
name = "wzed"
version = "0.0.1"
description = "100% local voice dictation for Windows (a private alternative to Wispr Flow)"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.1",
    "onnx-asr[gpu,hub]>=0.8",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9",
    "jiwer>=3.0",
    "pynput>=1.7",
    "pywin32>=306",
    "pydantic-settings>=2.2",
    "onnxruntime-gpu>=1.20,<1.23",
    "nvidia-cuda-runtime-cu12>=12.9.79",
    "nvidia-cufft-cu12>=11.4.1.4",
    "nvidia-curand-cu12>=10.3.10.19",
    "PySide6>=6.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

# Sem console-scripts/gui-scripts de propósito: os .exe que o pip gera são NÃO
# ASSINADOS e o Norton os bloqueia por reputação. Rodamos via o pythonw.exe do venv
# (assinado pela PSF) com `-m wzed` (ver src/wzed/__main__.py e scripts/install.ps1).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wzed"]

# Grupo dev: o `uv sync` instala por padrão, então pytest nunca some do venv
# (um `uv sync --extra api` sem `--extra dev` removia o pytest e os testes
# passavam a rodar num ambiente isolado, sem as deps do projeto).
[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.0",
]
